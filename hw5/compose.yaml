services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: movies
      POSTGRES_USER: movies
      POSTGRES_PASSWORD: movies
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - movies_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U movies -d movies"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  movies_data:
