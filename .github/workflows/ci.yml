name: Go CI

on:
  - push
  - pull_request  

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Lint, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true

      - name: Verify dependencies
        run: go mod verify

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.60.3

      - name: Run unit tests
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Build binary
        run: go build -v ./...